version: 2.1

# SSH: grok clona por git@github.com. Clone usa Additional SSH Key (igual payments).
# Fingerprint atual: SHA256:hCo1yHQFxjlOt16UfxDnzI5brvw6jzOLn3tTTYh22Pk
# Private key local: C:\Users\wende\.ssh\contbank-circleci-deploy\circleci_grok
# GitHub deploy key: circleci-grok-deploy (write)
# CircleCI: Project Settings → SSH Keys → Add SSH Key (hostname github.com) → colar a privada

defaults: &defaults
  working_directory: ~/project
  environment:
    APP_NAME: grok

ssh_fingerprint: &ssh_fingerprint
  - "SHA256:hCo1yHQFxjlOt16UfxDnzI5brvw6jzOLn3tTTYh22Pk"

commands:
  autotag:
    steps:
      - run:
          name: Get autotag
          command: |
            sudo apt-get update --fix-missing \
            && sudo apt-get install wget git -y \
            && wget -O autotag https://github.com/pantheon-systems/autotag/releases/download/1.1.1/Linux \
            && chmod +x autotag \
            && sudo mv autotag /usr/local/bin/

jobs:
  run-tests:
    <<: *defaults
    docker:
      - image: cimg/go:1.24.0
      - image: localstack/localstack:2.3.2
      - image: mongo:6.0
      - image: redis:7.0
    environment:
      - DEBUG: 0
      - SERVICES: sqs,sns,kms
      - AWS_ACCESS_KEY_ID: teste
      - AWS_SECRET_ACCESS_KEY: teste
      - CGO_ENABLED: "0"
    steps:
      - add_ssh_keys:
          fingerprints: *ssh_fingerprint
      - run:
          name: GitHub known hosts
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Checkout
          command: |
            git clone git@github.com:contbank/grok.git .
            git fetch --depth 1 origin "$CIRCLE_SHA1"
            git checkout --force "$CIRCLE_SHA1"
      - restore_cache:
          keys:
            - vendor-{{ checksum "go.sum" }}
      - run:
          name: Waiting for LocalStack ...
          command: |
            until nc -z localhost 4566; do
                 printf '.'
                 sleep 1
             done
            echo "LocalStack is accepting connections on 4566"
      - run:
          name: Dependencies
          command: go mod vendor
      - run:
          name: Run Tests
          command: go test -failfast -timeout 2m -cover ./...
      - save_cache:
          key: vendor-{{ checksum "go.sum" }}
          paths:
            - vendor
      - persist_to_workspace:
          root: .
          paths:
            - .
  release-vesion:
    <<: *defaults
    docker:
      - image: cimg/go:1.24.0
    steps:
      - add_ssh_keys:
          fingerprints: *ssh_fingerprint
      - attach_workspace:
          at: .
      - autotag
      - run:
          name: Create Version
          command: autotag > current_version || autotag 2>&1
      - run:
          name: Known Hosts
          command: ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - run:
          name: Tag Git Version
          command: |
            VERSION=$(cat current_version)
            if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
              echo "Tag ${VERSION} already exists on remote, skipping push"
            else
              git tag "${VERSION}" && git push origin "${VERSION}"
            fi
      - persist_to_workspace:
          root: .
          paths:
            - .

workflows:
  version: 2
  build-deploy:
    jobs:
      - run-tests

      - release-vesion:
          requires:
            - run-tests
          filters:
            branches:
              only:
                - master
