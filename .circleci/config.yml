version: 2.1

defaults: &defaults
  working_directory: /go/src/github.com/contbank/grok

commands:
  autotag:
    steps:
      - run: |
          make install-autotag

jobs:
  run-tests:
    <<: *defaults
    docker:
      - image: circleci/golang:1.17
        environment:
          AWS_ACCESS_KEY_ID: teste
          AWS_SECRET_ACCESS_KEY: teste
      - image: mongo:6.0
      - image: redis:7.0
      - image: localstack/localstack:2.3.2
        environment:
          DEBUG: 0
          SERVICES: sqs,sns,kms
    steps:
      - checkout
      - run:
          name: Waiting for localstack ...
          command: |
            until nc -z localhost 4566; do
                 printf '.'
                 sleep 1
             done
      - run:
          name: Dependencies
          command: go mod vendor
      - run:
          name: Run Tests
          command: go test -failfast -cover ./...
  release-vesion:
    <<: *defaults
    docker:
      - image: circleci/golang:1.17
    steps:
      - add_ssh_keys:
          fingerprints:
            - 4e:da:a0:a1:fe:2e:e3:dd:89:5a:af:d2:f9:a5:2c:0d
      - checkout
      - autotag
      - run:
          name: Tag Git Version
          command: make tag-version

workflows:
  version: 2
  build-deploy:
    jobs:
      - run-tests

      - release-vesion:
          requires:
            - run-tests
          filters:
            branches:
              only:
                - master
