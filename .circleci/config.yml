version: 2.1

defaults: &defaults
  working_directory: /go/src/github.com/contbank/grok
  environment:
    APP_NAME: grok
commands:
  autotag:
    steps:
      - run:
          name: Get autotag
          command: |
            apt-get update --fix-missing \
            && apt-get install wget git -y \
            && wget -O autotag https://github.com/pantheon-systems/autotag/releases/download/1.1.1/Linux \
            && chmod +x autotag \
            && mv autotag /usr/local/bin/

jobs:
  run-tests:
    <<: *defaults
    docker:
      - image: golang:1.24-alpine
      - image: localstack/localstack:2.3.2
      - image: mongo:6.0
      - image: redis:7.0
    environment:
      - DEBUG: 0
      - SERVICES: sqs,sns,kms
      - AWS_ACCESS_KEY_ID: teste
      - AWS_SECRET_ACCESS_KEY: teste
      - CGO_ENABLED: "0"
    steps:
      - checkout
      - run:
          name: Install deps (Alpine)
          command: apk add --no-cache git ca-certificates netcat-openbsd
      - restore_cache:
          keys:
            - vendor-{{ checksum "go.sum" }}
      - run:
          name: Waiting for LocalStack ...
          command: |
            until nc -z localhost 4566; do
                 printf '.'
                 sleep 1
             done
            echo "LocalStack is accepting connections on 4566"
      - run:
          name: Dependencies
          command: go mod vendor
      - run:
          name: Run Tests
          command: go test -failfast -timeout 30s -cover ./...
      - save_cache:
          key: vendor-{{ checksum "go.sum" }}
          paths:
            - vendor
      - persist_to_workspace:
          root: .
          paths:
            - .
  release-vesion:
    <<: *defaults
    docker:
      - image: google/cloud-sdk
    steps:
      - add_ssh_keys:
          fingerprints:
            - 4e:da:a0:a1:fe:2e:e3:dd:89:5a:af:d2:f9:a5:2c:0d
      - attach_workspace:
          at: .
      - autotag
      - run:
          name: Create Version
          command: autotag > current_version || autotag 2>&1
      - run:
          name: Known Hosts
          command: ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - run:
          name: Tag Git Version
          command: |
            VERSION=$(cat current_version)
            if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q .; then
              echo "Tag ${VERSION} already exists on remote, skipping push"
            else
              git tag "${VERSION}" && git push origin "${VERSION}"
            fi
      - persist_to_workspace:
          root: .
          paths:
            - .

workflows:
  version: 2
  build-deploy:
    jobs:
      - run-tests

      - release-vesion:
          requires:
            - run-tests
          filters:
            branches:
              only:
                - master
